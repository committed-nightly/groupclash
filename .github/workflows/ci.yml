name: test

on:
  push:
    branches: [main]
  pull_request:

# Also the worked example. This is the group the tool is arguing for: it
# varies per pull request on `pull_request`, falls back to the branch on a
# push, and is prefixed with the workflow name so it cannot collide with
# another file. The dogfood job below checks that groupclash agrees.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  dogfood:
    # Run the tool on this repository, for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: our own concurrency group is what we tell everyone to write
        run: groupclash

      - name: nothing is left undecided in our own workflows
        run: |
          groupclash > report.txt
          # Whole line, and before the absence check, because neither this
          # step nor the one above it can tell a clean repository from one
          # that no longer holds the subject: groupclash exits 0 on a
          # workflow set with no concurrency block in it at all. Delete the
          # block at the top of this file and both steps stay green while
          # the README's worked example is gone.
          grep -qxF '1 workflow checked, 1 concurrency block, 0 findings' report.txt
          if grep -q '^not checked:' report.txt; then
            cat report.txt
            echo "a group in this repository could not be decided"
            exit 1
          fi

      - name: the guard above fires when a group really cannot be decided
        # The guard is an absence check and nothing here established that
        # `not checked:` can be printed at all, so it would have gone on
        # passing if the undecided path stopped working (logbook#64). The
        # witness cannot come from this repository, because the guard
        # requires the string's absence here.
        run: |
          groupclash examples/undecidable-group > control.txt
          cat control.txt
          grep -q '^not checked: .github/workflows/undecidable.yml concurrency.group' control.txt
          grep -qF 'cannot decide matrix.os' control.txt

      # `code=0; cmd || code=$?` rather than `cmd; code=$?`, because these
      # steps run under `bash -e` and the whole point is to run a command
      # that exits non-zero.
      - name: the group everyone copies is caught
        # The corpus is a file, not a heredoc. GitHub substitutes ${{ }} into
        # a `run:` script before the shell sees it, so the heredoc this step
        # used to carry wrote `group: test-<branch>` on a pull request and
        # `group: test-` on a push -- a literal string, never the template in
        # this step's name. Both are findings, so it passed either way. See
        # examples/README.md for the log it came out of.
        run: |
          code=0; groupclash examples/copied-group || code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: a directory with no workflows is an error, not a pass
        run: |
          mkdir -p /tmp/empty
          code=0; groupclash /tmp/empty || code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
